name: Commit Build

on:
  push:
    branches: [master, "feature/*", "chore/*"]
  pull_request:
    branches: [master, "feature/*", "chore/*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build:typescript
      - run: npm test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: win-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SEA_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: bin/mcsleepingserverstarter-*
          if-no-files-found: error

  build-alpine:
    needs: test
    runs-on: ubuntu-24.04-arm
    container:
      image: node:24-alpine
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
        shell: sh
      - run: npm run build
        shell: sh
        env:
          SEA_TARGET: alpine-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-alpine-arm64
          path: bin/mcsleepingserverstarter-*
          if-no-files-found: error
